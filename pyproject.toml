[project]
name = "leadreach"
version = "0.1.0"
description = "LeadReach: approval-first local lead finder + outreach copilot for brands on ASI:One (Fetch-A-Thon 3.0)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "uagents==0.26.1",
    "uagents-core==0.4.12",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "dnspython>=2.6",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402"]  # agents set env vars before importing siblings
